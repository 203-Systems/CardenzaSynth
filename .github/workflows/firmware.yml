# Builds the firmware and runs the host tests on every push and pull request. A push to main
# publishes a Nightly to the Launcher hub; a vMAJOR.MINOR.PATCH tag (equal to version.txt)
# publishes that release and makes a GitHub Release holding its bin.
#
# Repository settings: secret CARDENZA_HAL_TOKEN (read access to 203-Systems/CardenzaHAL),
# secret LAUNCHER_APP_TOKEN (the Cardenza Synth App Token, target cardenza); optional variables
# LAUNCHER_APP_ID and LAUNCHER_PUBLISH_URL.
name: Firmware
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.5
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/submodules
        with:
          hal-token: ${{ secrets.CARDENZA_HAL_TOKEN }}
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" > /dev/null
          version=$(tr -d '[:space:]' < version.txt)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.txt ($version)"
            exit 1
          fi
          cmake -DCARDENZA_ROOT="$PWD" -P cmake/ValidateArchitecture.cmake
          idf.py -C Devices/Cardenza -B "$PWD/build/Cardenza" build
          # A bin built from changed sources says so in its log (+); none of those is published.
          grep -q 'kDirty = false' build/Cardenza/esp-idf/Cardenza/build-info/CardenzaBuildInfo.h || {
            git status --short; echo "::error::The build changed tracked files"; exit 1; }
          sha256sum build/Cardenza/CardenzaSynthFirmware.bin build/Cardenza/CardenzaSynthFirmware.elf
      # The ELF decodes the backtraces in the log of a device running this bin: kept with it.
      - uses: actions/upload-artifact@v4
        with:
          name: cardenza-synth-firmware
          retention-days: 90
          if-no-files-found: error
          path: |
            build/Cardenza/CardenzaSynthFirmware.bin
            build/Cardenza/CardenzaSynthFirmware.elf
            build/Cardenza/bootloader/bootloader.bin
            build/Cardenza/partition_table/partition-table.bin
            build/Cardenza/flash_args
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/submodules
        with:
          hal-token: ${{ secrets.CARDENZA_HAL_TOKEN }}
      - name: Host tests
        run: |
          cmake -S . -B build/host -DDEVICE=CardenzaSim -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host --parallel
          ctest --test-dir build/host --output-on-failure
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [firmware, host]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: launcher-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cardenza-synth-firmware
          path: dist
      # The hub's Edge function validates, mirrors and records the bin; this job holds only the
      # App's scoped token, never database or storage keys.
      - name: Upload to the Launcher hub
        env:
          PUBLISH_URL: ${{ vars.LAUNCHER_PUBLISH_URL || 'https://uullfvoakowofzhaqdix.supabase.co/functions/v1/publish' }}
          APP_ID: ${{ vars.LAUNCHER_APP_ID || '19297860-2e50-46b4-b326-c938e29fd9ad' }}
          APP_TOKEN: ${{ secrets.LAUNCHER_APP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$APP_TOKEN" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "::error::LAUNCHER_APP_TOKEN is not configured"; exit 1; fi
            echo "::notice::LAUNCHER_APP_TOKEN is not configured; no Nightly was published."
            exit 0
          fi
          test -s dist/CardenzaSynthFirmware.bin
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            set -- -F release_type=release -F "tag=$GITHUB_REF_NAME"
          else
            set -- -F release_type=nightly -F "source_commit=$GITHUB_SHA"
          fi
          curl --fail-with-body --silent --show-error --max-time 300 --retry 2 -X POST "$PUBLISH_URL" \
            -H "Authorization: Bearer $APP_TOKEN" "$@" -F "app_id=$APP_ID" -F target=cardenza \
            -F "image=@dist/CardenzaSynthFirmware.bin;type=application/octet-stream" -o response.json
          jq -e '.status == "published" or .status == "unchanged"' response.json > /dev/null
          jq '{status, channel, version, build, sha256, cleanup_pending}' response.json
      - name: GitHub Release with the bin
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --title "CardenzaSynth ${GITHUB_REF_NAME#v}" \
              --notes "Published to the Launcher hub as Cardenza Synth ${GITHUB_REF_NAME#v} (target cardenza)."
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/CardenzaSynthFirmware.bin
